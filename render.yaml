services:
  - type: web
    name: floranet-api
    runtime: docker
    # Path to the Dockerfile, relative to the repo root
    dockerfilePath: ./backend/Dockerfile
    # Build context is repo root — Dockerfile uses backend/ prefixes for all COPY paths
    dockerContext: .
    envVars:
      - key: OLLAMA_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OLLAMA_TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: OLLAMA_VISION_MODEL
        value: openai/gpt-oss-120b
      - key: OLLAMA_AGENT_MODEL
        value: openai/gpt-oss-20b
      - key: AGENT_MAX_STEPS
        value: "6"
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "60"
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: CELERY_BROKER_URL
        value: rediss://:gQAAAAAABOwsAAIgcDE4NzkzMGU4ODVmNzM0Njc2YTNjNGZlMGI5NGFhZDNhMg@central-duckling-322604.upstash.io:6380
      - key: CELERY_RESULT_BACKEND
        value: rediss://:gQAAAAAABOwsAAIgcDE4NzkzMGU4ODVmNzM0Njc2YTNjNGZlMGI5NGFhZDNhMg@central-duckling-322604.upstash.io:6380
      # Set CORS_ORIGINS to your Vercel frontend URL after first deploy
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_KEY
        value: ""
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: WHISPER_CPU_THREADS
        value: "4"
      # Secret values — set these manually in Render dashboard, not here
      - key: OLLAMA_API_KEY
        sync: false
